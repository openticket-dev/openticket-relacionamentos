<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!--
    OpenTicket Circuit Neon Emblem — azureNeon QR variant centerpiece.
    Cyberpunk / Tron / circuit-board aesthetic. Hexagonal frame, geometric
    monospace OT, 6 corner traces ending in solder pads, 4 cardinal LED
    dot indicators, scanlines, and radial glow. Cyan-on-transparent.
  -->
  <defs>
    <radialGradient id="neon-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#5ce1e6" stop-opacity="1"/>
      <stop offset="55%"  stop-color="#00d9ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neon-pad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#aef6fc"/>
      <stop offset="50%"  stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#004a5c"/>
    </radialGradient>
    <filter id="neon-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="neon-blur-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <!-- Clip for scanlines so they only cover the hex interior -->
    <clipPath id="neon-hexclip">
      <polygon points="200,85 299.7,142.5 299.7,257.5 200,315 100.3,257.5 100.3,142.5"/>
    </clipPath>
  </defs>

  <!-- Soft central glow -->
  <circle cx="200" cy="200" r="145" fill="url(#neon-glow)" opacity="0.35" filter="url(#neon-blur)"/>

  <!-- 4 cardinal LED indicators (outer faint / middle / center bright) -->
  <g>
    <!-- N -->
    <circle cx="200" cy="48"  r="9"   fill="#00d9ff" opacity="0.15"/>
    <circle cx="200" cy="48"  r="5"   fill="#00d9ff" opacity="0.55"/>
    <circle cx="200" cy="48"  r="2.2" fill="#aef6fc"/>
    <!-- S -->
    <circle cx="200" cy="352" r="9"   fill="#00d9ff" opacity="0.15"/>
    <circle cx="200" cy="352" r="5"   fill="#00d9ff" opacity="0.55"/>
    <circle cx="200" cy="352" r="2.2" fill="#aef6fc"/>
    <!-- W -->
    <circle cx="48"  cy="200" r="9"   fill="#00d9ff" opacity="0.15"/>
    <circle cx="48"  cy="200" r="5"   fill="#00d9ff" opacity="0.55"/>
    <circle cx="48"  cy="200" r="2.2" fill="#aef6fc"/>
    <!-- E -->
    <circle cx="352" cy="200" r="9"   fill="#00d9ff" opacity="0.15"/>
    <circle cx="352" cy="200" r="5"   fill="#00d9ff" opacity="0.55"/>
    <circle cx="352" cy="200" r="2.2" fill="#aef6fc"/>
  </g>

  <!--
    Circuit traces: 6 traces leaving each hex corner with 90° bends,
    terminating in solder-pad circles. Each trace drawn twice (base stroke
    + blurred glow layer).
    Hex corners:
      Top        (200, 85)
      Upper-right(299.7, 142.5)
      Lower-right(299.7, 257.5)
      Bottom     (200, 315)
      Lower-left (100.3, 257.5)
      Upper-left (100.3, 142.5)
  -->
  <g fill="none" stroke="#00d9ff" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Top trace -->
    <path d="M200,85 L200,60 L230,60"/>
    <!-- Upper-right trace -->
    <path d="M299.7,142.5 L322,142.5 L322,112"/>
    <!-- Lower-right trace -->
    <path d="M299.7,257.5 L322,257.5 L322,288"/>
    <!-- Bottom trace -->
    <path d="M200,315 L200,340 L170,340"/>
    <!-- Lower-left trace -->
    <path d="M100.3,257.5 L78,257.5 L78,288"/>
    <!-- Upper-left trace -->
    <path d="M100.3,142.5 L78,142.5 L78,112"/>
  </g>
  <!-- Trace glow overlay -->
  <g fill="none" stroke="#5ce1e6" stroke-width="2.2" opacity="0.55" filter="url(#neon-blur-soft)">
    <path d="M200,85 L200,60 L230,60"/>
    <path d="M299.7,142.5 L322,142.5 L322,112"/>
    <path d="M299.7,257.5 L322,257.5 L322,288"/>
    <path d="M200,315 L200,340 L170,340"/>
    <path d="M100.3,257.5 L78,257.5 L78,288"/>
    <path d="M100.3,142.5 L78,142.5 L78,112"/>
  </g>

  <!-- Solder pads at trace terminals -->
  <g>
    <circle cx="230" cy="60"  r="4.5" fill="url(#neon-pad)" stroke="#00d9ff" stroke-width="0.8"/>
    <circle cx="322" cy="112" r="4.5" fill="url(#neon-pad)" stroke="#00d9ff" stroke-width="0.8"/>
    <circle cx="322" cy="288" r="4.5" fill="url(#neon-pad)" stroke="#00d9ff" stroke-width="0.8"/>
    <circle cx="170" cy="340" r="4.5" fill="url(#neon-pad)" stroke="#00d9ff" stroke-width="0.8"/>
    <circle cx="78"  cy="288" r="4.5" fill="url(#neon-pad)" stroke="#00d9ff" stroke-width="0.8"/>
    <circle cx="78"  cy="112" r="4.5" fill="url(#neon-pad)" stroke="#00d9ff" stroke-width="0.8"/>
    <!-- solder pad inner bright pixels -->
    <circle cx="230" cy="60"  r="1.3" fill="#aef6fc"/>
    <circle cx="322" cy="112" r="1.3" fill="#aef6fc"/>
    <circle cx="322" cy="288" r="1.3" fill="#aef6fc"/>
    <circle cx="170" cy="340" r="1.3" fill="#aef6fc"/>
    <circle cx="78"  cy="288" r="1.3" fill="#aef6fc"/>
    <circle cx="78"  cy="112" r="1.3" fill="#aef6fc"/>
  </g>

  <!-- Hexagonal frame: fill semi-transparent, stroke cyan -->
  <polygon points="200,85 299.7,142.5 299.7,257.5 200,315 100.3,257.5 100.3,142.5"
           fill="#0a1128" fill-opacity="0.5"
           stroke="#00d9ff" stroke-width="3" stroke-linejoin="miter"/>
  <!-- Hex glow duplicate (blurred) -->
  <polygon points="200,85 299.7,142.5 299.7,257.5 200,315 100.3,257.5 100.3,142.5"
           fill="none" stroke="#5ce1e6" stroke-width="4" opacity="0.55" filter="url(#neon-blur-soft)"/>
  <!-- Inner thin line parallel for double-stroke feel -->
  <polygon points="200,95 290.8,147.7 290.8,252.3 200,305 109.2,252.3 109.2,147.7"
           fill="none" stroke="#00d9ff" stroke-width="0.8" opacity="0.55"/>

  <!-- Faint horizontal scanlines inside the hex -->
  <g clip-path="url(#neon-hexclip)" opacity="0.1">
    <g stroke="#5ce1e6" stroke-width="0.6">
      <line x1="100" y1="100" x2="300" y2="100"/>
      <line x1="100" y1="115" x2="300" y2="115"/>
      <line x1="100" y1="130" x2="300" y2="130"/>
      <line x1="100" y1="145" x2="300" y2="145"/>
      <line x1="100" y1="160" x2="300" y2="160"/>
      <line x1="100" y1="175" x2="300" y2="175"/>
      <line x1="100" y1="190" x2="300" y2="190"/>
      <line x1="100" y1="205" x2="300" y2="205"/>
      <line x1="100" y1="220" x2="300" y2="220"/>
      <line x1="100" y1="235" x2="300" y2="235"/>
      <line x1="100" y1="250" x2="300" y2="250"/>
      <line x1="100" y1="265" x2="300" y2="265"/>
      <line x1="100" y1="280" x2="300" y2="280"/>
      <line x1="100" y1="295" x2="300" y2="295"/>
      <line x1="100" y1="310" x2="300" y2="310"/>
    </g>
  </g>

  <!--
    Geometric monospace OT built from paths (no <text> — fonts unreliable).
    Eurostile/Orbitron-inspired. Both letters 88px tall, thin 6px strokes,
    chamfered corners for that squared tech feel.
    Letters rendered twice: base solid + blurred glow duplicate.
  -->
  <g transform="translate(200 202)">
    <!-- O: hollow square with chamfered corners -->
    <g stroke="#aef6fc" stroke-width="5" fill="none">
      <path d="M -45,-42
               L -45,30
               L -37,42
               L 5,42
               L 13,30
               L 13,-42
               L 5,-54
               L -37,-54 Z"/>
    </g>
    <!-- O glow layer -->
    <g stroke="#5ce1e6" stroke-width="7" fill="none" opacity="0.55" filter="url(#neon-blur-soft)">
      <path d="M -45,-42
               L -45,30
               L -37,42
               L 5,42
               L 13,30
               L 13,-42
               L 5,-54
               L -37,-54 Z"/>
    </g>

    <!-- T: crossbar + stem, chamfered -->
    <g stroke="#aef6fc" stroke-width="5" fill="none">
      <!-- Crossbar: 60px wide, 10px tall -->
      <path d="M 18,-54 L 58,-54"/>
      <!-- Left terminal notch -->
      <path d="M 18,-54 L 18,-46"/>
      <!-- Right terminal notch -->
      <path d="M 58,-54 L 58,-46"/>
      <!-- Crossbar lower line -->
      <path d="M 18,-46 L 58,-46"/>
      <!-- Stem vertical (centered at x=38) -->
      <path d="M 34,-46 L 34,38 L 38,42 L 42,38 L 42,-46"/>
    </g>
    <!-- T glow layer -->
    <g stroke="#5ce1e6" stroke-width="7" fill="none" opacity="0.55" filter="url(#neon-blur-soft)">
      <path d="M 18,-54 L 58,-54 L 58,-46 L 18,-46 Z"/>
      <path d="M 34,-46 L 34,38 L 38,42 L 42,38 L 42,-46"/>
    </g>

    <!-- Tiny tech tick on stem bottom (circuit detail) -->
    <circle cx="38" cy="42" r="1.6" fill="#aef6fc"/>
  </g>

  <!-- Tiny circuit node dots inside hex for board detail -->
  <g fill="#00d9ff" opacity="0.5">
    <circle cx="140" cy="150" r="1"/>
    <circle cx="260" cy="150" r="1"/>
    <circle cx="140" cy="250" r="1"/>
    <circle cx="260" cy="250" r="1"/>
    <circle cx="200" cy="120" r="1"/>
    <circle cx="200" cy="280" r="1"/>
  </g>
</svg>
