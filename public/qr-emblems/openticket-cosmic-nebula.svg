<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!--
    OpenTicket Cosmic Nebula Emblem — royalPurple QR variant centerpiece.
    Celestial / zodiac feel: purple planet with radial glow, 3 tilted orbital
    ellipses, ~20 scattered 4-point stars outside the planet, 3 larger feature
    stars with rays, and an elegant Didot-style OT monogram on the planet face.
    Transparent background; field fades naturally at edges.
  -->
  <defs>
    <radialGradient id="cos-planet" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0%"  stop-color="#7a5bbf"/>
      <stop offset="35%" stop-color="#3b1f6b"/>
      <stop offset="70%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </radialGradient>
    <radialGradient id="cos-rim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="82%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="92%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cos-nebulaGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#c084fc" stop-opacity="0.35"/>
      <stop offset="50%"  stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1a0a2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cos-starGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#fff3c0" stop-opacity="0.9"/>
      <stop offset="60%"  stop-color="#f4d47c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f4d47c" stop-opacity="0"/>
    </radialGradient>
    <filter id="cos-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="cos-blur-big" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- Nebula backdrop wash (fades to transparent at edges) -->
  <circle cx="200" cy="200" r="190" fill="url(#cos-nebulaGlow)"/>
  <!-- Secondary offset nebula patch -->
  <ellipse cx="130" cy="130" rx="90" ry="60"
           fill="#6366f1" opacity="0.12" filter="url(#cos-blur-big)"/>
  <ellipse cx="280" cy="260" rx="80" ry="55"
           fill="#a855f7" opacity="0.14" filter="url(#cos-blur-big)"/>

  <!-- Scattered constellation: small 4-point stars (outside planet r=100) -->
  <g fill="#f4d47c">
    <!-- 4-point star path reused by transforms. Drawn as rotated squares ("plus" with pointy ends). -->
    <!-- Template: M0,-a L b,0 L0,a L-b,0 Z with small a, b -->
    <g transform="translate(70 60)"><path d="M0,-4 L1.5,0 L0,4 L-1.5,0 Z"/></g>
    <g transform="translate(105 40)"><path d="M0,-3 L1,0 L0,3 L-1,0 Z"/></g>
    <g transform="translate(40 110)"><path d="M0,-5 L2,0 L0,5 L-2,0 Z"/></g>
    <g transform="translate(85 180)"><path d="M0,-3.5 L1.2,0 L0,3.5 L-1.2,0 Z"/></g>
    <g transform="translate(55 240)"><path d="M0,-4.5 L1.7,0 L0,4.5 L-1.7,0 Z"/></g>
    <g transform="translate(110 310)"><path d="M0,-3 L1.1,0 L0,3 L-1.1,0 Z"/></g>
    <g transform="translate(175 360)"><path d="M0,-4 L1.4,0 L0,4 L-1.4,0 Z"/></g>
    <g transform="translate(255 355)"><path d="M0,-3 L1.1,0 L0,3 L-1.1,0 Z"/></g>
    <g transform="translate(320 310)"><path d="M0,-5 L1.9,0 L0,5 L-1.9,0 Z"/></g>
    <g transform="translate(360 220)"><path d="M0,-3.5 L1.3,0 L0,3.5 L-1.3,0 Z"/></g>
    <g transform="translate(340 130)"><path d="M0,-4 L1.5,0 L0,4 L-1.5,0 Z"/></g>
    <g transform="translate(300 70)"><path d="M0,-3 L1.1,0 L0,3 L-1.1,0 Z"/></g>
    <g transform="translate(240 45)"><path d="M0,-4.5 L1.7,0 L0,4.5 L-1.7,0 Z"/></g>
    <g transform="translate(190 30)"><path d="M0,-3.5 L1.3,0 L0,3.5 L-1.3,0 Z"/></g>
    <g transform="translate(30 175)"><path d="M0,-3 L1.1,0 L0,3 L-1.1,0 Z"/></g>
    <g transform="translate(370 175)"><path d="M0,-3 L1.1,0 L0,3 L-1.1,0 Z"/></g>
    <g transform="translate(360 280)"><path d="M0,-3.5 L1.2,0 L0,3.5 L-1.2,0 Z"/></g>
    <g transform="translate(80 330)"><path d="M0,-2.5 L1,0 L0,2.5 L-1,0 Z"/></g>
    <g transform="translate(25 270)"><path d="M0,-3 L1.1,0 L0,3 L-1.1,0 Z"/></g>
    <g transform="translate(300 340)"><path d="M0,-3.5 L1.3,0 L0,3.5 L-1.3,0 Z"/></g>
  </g>
  <!-- Tiny cross-hair glow for each star -->
  <g stroke="#f4d47c" stroke-width="0.4" opacity="0.55">
    <line x1="70"  y1="55"  x2="70"  y2="65"/><line x1="65"  y1="60"  x2="75"  y2="60"/>
    <line x1="40"  y1="104" x2="40"  y2="116"/><line x1="34"  y1="110" x2="46"  y2="110"/>
    <line x1="55"  y1="234" x2="55"  y2="246"/><line x1="49"  y1="240" x2="61"  y2="240"/>
    <line x1="320" y1="304" x2="320" y2="316"/><line x1="314" y1="310" x2="326" y2="310"/>
    <line x1="340" y1="125" x2="340" y2="135"/><line x1="334" y1="130" x2="346" y2="130"/>
    <line x1="240" y1="40"  x2="240" y2="50"/><line x1="235" y1="45"  x2="245" y2="45"/>
  </g>

  <!-- 3 FEATURE stars with rays (upper-left, lower-right, center-top) -->
  <g>
    <!-- Upper-left feature star -->
    <g transform="translate(88 92)">
      <circle r="10" fill="url(#cos-starGlow)"/>
      <g stroke="#fff3c0" stroke-width="0.8" opacity="0.9">
        <line x1="0" y1="-14" x2="0" y2="14"/>
        <line x1="-14" y1="0" x2="14" y2="0"/>
        <line x1="-9" y1="-9" x2="9" y2="9" opacity="0.5"/>
        <line x1="-9" y1="9" x2="9" y2="-9" opacity="0.5"/>
      </g>
      <path d="M0,-6 L1.8,0 L0,6 L-1.8,0 Z" fill="#fff3c0"/>
    </g>
    <!-- Lower-right feature star -->
    <g transform="translate(312 308)">
      <circle r="9" fill="url(#cos-starGlow)"/>
      <g stroke="#fff3c0" stroke-width="0.7" opacity="0.85">
        <line x1="0" y1="-13" x2="0" y2="13"/>
        <line x1="-13" y1="0" x2="13" y2="0"/>
        <line x1="-8" y1="-8" x2="8" y2="8" opacity="0.5"/>
        <line x1="-8" y1="8" x2="8" y2="-8" opacity="0.5"/>
      </g>
      <path d="M0,-5 L1.6,0 L0,5 L-1.6,0 Z" fill="#fff3c0"/>
    </g>
    <!-- Center-top feature star -->
    <g transform="translate(205 50)">
      <circle r="11" fill="url(#cos-starGlow)"/>
      <g stroke="#fff3c0" stroke-width="0.9" opacity="0.9">
        <line x1="0" y1="-16" x2="0" y2="16"/>
        <line x1="-16" y1="0" x2="16" y2="0"/>
        <line x1="-10" y1="-10" x2="10" y2="10" opacity="0.55"/>
        <line x1="-10" y1="10" x2="10" y2="-10" opacity="0.55"/>
      </g>
      <path d="M0,-7 L2,0 L0,7 L-2,0 Z" fill="#fff3c0"/>
    </g>
  </g>

  <!-- 3 tilted orbital ellipses around the planet (rx=115 ry=35/28/42) -->
  <g fill="none" stroke="#a855f7" stroke-linecap="round">
    <ellipse cx="200" cy="200" rx="118" ry="32"
             stroke-width="0.8" opacity="0.7"
             transform="rotate(15 200 200)"/>
    <ellipse cx="200" cy="200" rx="124" ry="28"
             stroke-width="0.8" opacity="0.55"
             transform="rotate(-20 200 200)"/>
    <ellipse cx="200" cy="200" rx="112" ry="42"
             stroke-width="0.8" opacity="0.65"
             transform="rotate(35 200 200)"/>
  </g>

  <!-- Planet body -->
  <!-- Outer rim glow -->
  <circle cx="200" cy="200" r="110" fill="url(#cos-rim)" opacity="0.6" filter="url(#cos-blur)"/>
  <!-- Main planet -->
  <circle cx="200" cy="200" r="100" fill="url(#cos-planet)"/>
  <!-- Subtle surface striations / storm bands -->
  <g opacity="0.25" stroke="#c084fc" fill="none">
    <path d="M125,190 Q200,175 275,195" stroke-width="1"/>
    <path d="M118,215 Q200,200 282,220" stroke-width="0.8"/>
    <path d="M130,168 Q200,155 270,172" stroke-width="0.7"/>
  </g>
  <!-- Specular highlight -->
  <ellipse cx="175" cy="170" rx="28" ry="16" fill="#e0d0ff" opacity="0.18" filter="url(#cos-blur)"/>

  <!-- Orbital front arc (drawn on top of planet so rings "pass in front") -->
  <g fill="none" stroke="#c084fc" stroke-linecap="round">
    <path d="M 82,210 A 118,32 15 0 0 318,190"
          stroke-width="0.9" opacity="0.5"/>
  </g>

  <!--
    OT monogram — thin elegant serif (Bodoni/Didot inspired).
    Built from paths (not <text>) so it never breaks from missing fonts.
    Color: light lavender #e0d0ff. Very thin strokes with pronounced
    vertical-horizontal contrast typical of Didone type.
  -->
  <g transform="translate(200 200)" fill="#e0d0ff" stroke="#e0d0ff" stroke-linejoin="round">
    <!--
      O: elegant ellipse with thin horizontal + thick vertical sides.
      Drawn as two nested ellipses: outer filled, inner (smaller) clipped out via even-odd fill.
    -->
    <path fill-rule="evenodd" stroke="none"
          d="M -20,-40
             C -20,-58 -36,-68 -50,-68
             C -64,-68 -80,-58 -80,-40
             L -80,0
             C -80,18 -64,28 -50,28
             C -36,28 -20,18 -20,0 Z
             M -28,-38
             C -28,-52 -40,-60 -50,-60
             C -60,-60 -72,-52 -72,-38
             L -72,-2
             C -72,12 -60,20 -50,20
             C -40,20 -28,12 -28,-2 Z"/>
    <!-- Tiny serif caps (top + bottom) on the O verticals (hairline touches) -->
    <rect x="-82" y="-42" width="4" height="1" stroke="none"/>
    <rect x="-22" y="-42" width="4" height="1" stroke="none"/>
    <rect x="-82" y="0" width="4" height="1" stroke="none"/>
    <rect x="-22" y="0" width="4" height="1" stroke="none"/>

    <!--
      T: thin horizontal crossbar with small serifs, thick vertical stem.
      Crossbar 60px wide, 3px thick. Stem 6px wide, 95px tall, small foot serifs.
    -->
    <!-- Crossbar hairline -->
    <rect x="2" y="-68" width="60" height="3" stroke="none"/>
    <!-- Crossbar serif drops (left + right) -->
    <rect x="2"  y="-68" width="2" height="8" stroke="none"/>
    <rect x="60" y="-68" width="2" height="8" stroke="none"/>
    <!-- Stem (thicker vertical) -->
    <rect x="28" y="-65" width="7" height="88" stroke="none"/>
    <!-- Stem foot serifs -->
    <rect x="20" y="23" width="23" height="2.5" stroke="none"/>
    <rect x="22" y="25.5" width="19" height="1.5" stroke="none" opacity="0.7"/>
    <!-- Tiny decorative dot in crossbar middle (Didone flourish) -->
    <circle cx="31.5" cy="-66.5" r="0.8" stroke="none"/>
  </g>

  <!-- Tiny faint haze around the whole composition (fades edges organically) -->
  <circle cx="200" cy="200" r="195" fill="none"
          stroke="#a855f7" stroke-width="0.4" opacity="0.15"/>
</svg>
