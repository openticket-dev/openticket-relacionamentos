<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!--
    OpenTicket Tech Minimal Emblem — ivoryMono QR variant centerpiece.
    Apple / architectural-drawing restraint. Clean geometric OT in charcoal,
    single thin framing circle, tiny compass-rose ticks with 00/15/30/45 labels,
    and a hairline 12x12 blueprint grid at 8% opacity. Zero gradients, zero glow.
    The restraint IS the luxury.
  -->
  <defs>
    <!-- Clip the grid to the inside of the frame circle -->
    <clipPath id="mono-frame">
      <circle cx="200" cy="200" r="179"/>
    </clipPath>
  </defs>

  <!-- Hairline 12x12 blueprint grid (clipped to frame, 0.08 opacity) -->
  <g clip-path="url(#mono-frame)" opacity="0.08" stroke="#1a1a1a" stroke-width="0.4" fill="none">
    <!-- Grid spans 240x240 centered at (200,200) -> from 80 to 320 in both axes. 12 cells = 20px each. -->
    <!-- Vertical lines (13 total, 12 cells) -->
    <line x1="80"  y1="80" x2="80"  y2="320"/>
    <line x1="100" y1="80" x2="100" y2="320"/>
    <line x1="120" y1="80" x2="120" y2="320"/>
    <line x1="140" y1="80" x2="140" y2="320"/>
    <line x1="160" y1="80" x2="160" y2="320"/>
    <line x1="180" y1="80" x2="180" y2="320"/>
    <line x1="200" y1="80" x2="200" y2="320"/>
    <line x1="220" y1="80" x2="220" y2="320"/>
    <line x1="240" y1="80" x2="240" y2="320"/>
    <line x1="260" y1="80" x2="260" y2="320"/>
    <line x1="280" y1="80" x2="280" y2="320"/>
    <line x1="300" y1="80" x2="300" y2="320"/>
    <line x1="320" y1="80" x2="320" y2="320"/>
    <!-- Horizontal lines (13 total) -->
    <line x1="80" y1="80"  x2="320" y2="80"/>
    <line x1="80" y1="100" x2="320" y2="100"/>
    <line x1="80" y1="120" x2="320" y2="120"/>
    <line x1="80" y1="140" x2="320" y2="140"/>
    <line x1="80" y1="160" x2="320" y2="160"/>
    <line x1="80" y1="180" x2="320" y2="180"/>
    <line x1="80" y1="200" x2="320" y2="200"/>
    <line x1="80" y1="220" x2="320" y2="220"/>
    <line x1="80" y1="240" x2="320" y2="240"/>
    <line x1="80" y1="260" x2="320" y2="260"/>
    <line x1="80" y1="280" x2="320" y2="280"/>
    <line x1="80" y1="300" x2="320" y2="300"/>
    <line x1="80" y1="320" x2="320" y2="320"/>
  </g>

  <!-- Single thin framing circle -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Compass ticks + tiny serif labels at 4 cardinal positions -->
  <g stroke="#1a1a1a" stroke-width="1.2">
    <!-- Top tick (12 o'clock) -->
    <line x1="200" y1="180" x2="200" y2="188"/>
    <!-- Right tick (3) -->
    <line x1="212" y1="200" x2="220" y2="200"/>
    <!-- Bottom tick (6) -->
    <line x1="200" y1="212" x2="200" y2="220"/>
    <!-- Left tick (9) -->
    <line x1="180" y1="200" x2="188" y2="200"/>
  </g>
  <g fill="#1a1a1a"
     font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif"
     font-size="8" font-weight="500" letter-spacing="0.5">
    <text x="200" y="175" text-anchor="middle">00</text>
    <text x="225" y="203" text-anchor="start">15</text>
    <text x="200" y="229" text-anchor="middle">30</text>
    <text x="175" y="203" text-anchor="end">45</text>
  </g>

  <!--
    OT monogram — pure geometric primitives, 180px tall total, centered.
    "O" = perfect circle, stroke 8, no fill.
    "T" = two perfect rectangles (crossbar + stem), same 8 thickness.
    Letters touch but don't overlap.
    The O is ~90px diameter (stroke-to-stroke), radius 41 center-line.
    T stem meets O rightmost point with a hairline kiss.
  -->
  <g transform="translate(200 200)">
    <!-- O: perfect circle outline. Center-line radius 42 → outer 46, inner 38 with stroke-width 8. -->
    <circle cx="-48" cy="0" r="42"
            fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="butt"/>

    <!--
      T:
        Crossbar: horizontal rect. 76 wide, 8 tall. Top aligned with top of O outer (y=-46).
        Stem:     vertical rect. 8 wide, 88 tall. Top touches crossbar (y=-46), bottom at y=42 (aligned with O bottom).
      T positioned so its leftmost edge touches the rightmost edge of the O.
      O rightmost x = -48 + 46 = -2. So T crossbar starts at x = -2.
    -->
    <!-- Crossbar: from x=-2 to x=74, y=-46 to y=-38 -->
    <rect x="-2" y="-46" width="76" height="8" fill="#1a1a1a"/>
    <!-- Stem: centered at x=32 (middle of crossbar), width 8, from y=-38 (top touches underside of crossbar) to y=46 -->
    <rect x="32" y="-38" width="8" height="84" fill="#1a1a1a"/>
  </g>

  <!-- 4 tiny corner "datum" marks just inside the circle (architectural drawing staple) -->
  <g stroke="#1a1a1a" stroke-width="0.6" fill="none" opacity="0.5">
    <!-- NE quadrant -->
    <path d="M310,110 L316,110 M313,107 L313,113"/>
    <!-- SE quadrant -->
    <path d="M310,290 L316,290 M313,287 L313,293"/>
    <!-- SW quadrant -->
    <path d="M84,290 L90,290 M87,287 L87,293"/>
    <!-- NW quadrant -->
    <path d="M84,110 L90,110 M87,107 L87,113"/>
  </g>
</svg>
